# Casalo – Test- und Produktivserver. Image und Umgebung trägt die Pipeline ein,
# HOST_PORT, VOLUME_NAME und die übrigen Variablen kommen aus dem Portainer-Stack (Deploy-Automatik).
services:
  app:
    image: ghcr.io/matthiasknauff/casalo:test-fbefd6b
    container_name: casalo-test
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:8000"
    environment:
      APP_ENV: test
      TZ: Europe/Berlin
      ABRUF_UHRZEIT: ${ABRUF_UHRZEIT:-06:00}
    volumes:
      - daten:/data

  # KI-Telefon: Asterisk an der Fritzbox + Sprachbot. Im Netzwerk des Servers (SIP und Sprache sind UDP).
  # Fritzbox-Zugang und Schlüssel stellt man in Casalo ein (KI-Telefon → Einstellungen);
  # der Container holt sie sich jede Minute. Bis dahin wartet er nur.
  telefon:
    image: ghcr.io/matthiasknauff/casalo-telefon:test-fbefd6b
    container_name: casalo-telefon-test
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app
    environment:
      TZ: Europe/Berlin
      CASALO_PORT: ${HOST_PORT}
    volumes:
      - daten:/casalo-daten:ro          # liest dort den Schlüssel für die Casalo-Schnittstelle

volumes:
  daten:
    name: ${VOLUME_NAME}
