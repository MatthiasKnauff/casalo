# Casalo – Test- und Produktivserver. Image und Umgebung trägt die Pipeline ein,
# HOST_PORT, VOLUME_NAME und die übrigen Variablen kommen aus dem Portainer-Stack (Deploy-Automatik).
services:
  app:
    image: ghcr.io/matthiasknauff/casalo:test-5b85813
    container_name: casalo-test
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:8000"
    environment:
      APP_ENV: test
      TZ: Europe/Berlin
      ABRUF_UHRZEIT: ${ABRUF_UHRZEIT:-06:00}
    volumes:
      - daten:/data

  # KI-Telefon: Asterisk an der Fritzbox + Sprachbot. Im Netzwerk des Servers (SIP und Sprache sind UDP).
  # Ohne SIP_BENUTZER wartet der Container nur (z. B. auf dem Testserver).
  telefon:
    image: ghcr.io/matthiasknauff/casalo-telefon:test-5b85813
    container_name: casalo-telefon-test
    restart: unless-stopped
    network_mode: host
    depends_on:
      - app
    environment:
      TZ: Europe/Berlin
      CASALO_PORT: ${HOST_PORT}
      FRITZBOX_HOST: ${FRITZBOX_HOST:-fritz.box}
      SIP_BENUTZER: ${SIP_BENUTZER:-}
      SIP_PASSWORT: ${SIP_PASSWORT:-}
      SIP_PORT: ${SIP_PORT:-5070}
      RTP_VON: ${RTP_VON:-10000}
      RTP_BIS: ${RTP_BIS:-10100}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_MODELL: ${DEEPGRAM_MODELL:-nova-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODELL: ${CLAUDE_MODELL:-claude-haiku-5-5}
    volumes:
      - daten:/casalo-daten:ro          # liest dort den Schlüssel für die Casalo-Schnittstelle

volumes:
  daten:
    name: ${VOLUME_NAME}
