; Eingehende Anrufe von der Fritzbox → Sprachbot (AudioSocket) → ggf. Weiterleitung im Notfall
[general]
static=yes
writeprotect=yes

[casalo-eingang]
exten => _X.,1,Goto(casalo,s,1)
exten => s,1,Goto(casalo,s,1)
exten => ${SIP_BENUTZER},1,Goto(casalo,s,1)

[casalo]
exten => s,1,Answer()
 same => n,Set(CASALO_ID=${UUID()})
 same => n,Set(ERG=${CURL(http://127.0.0.1:9093/start/${CASALO_ID},nummer=${URIENCODE(${CALLERID(num)})})})
 same => n,AudioSocket(${CASALO_ID},127.0.0.1:9092)
 same => n,Set(ZIEL=${CURL(http://127.0.0.1:9093/weiter/${CASALO_ID})})
 same => n,GotoIf($["${ZIEL}" = ""]?ende)
 same => n,Dial(PJSIP/${FILTER(0-9+,${ZIEL})}@fritzbox,60)
 same => n(ende),Hangup()
