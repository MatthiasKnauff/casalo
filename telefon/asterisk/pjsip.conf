; Casalo-Telefon: Asterisk meldet sich als IP-Telefon an der Fritzbox an.
; Werte (Fritzbox, Benutzer, Ports) kommen aus Casalo → KI-Telefon → Einstellungen.

[global]
type=global
user_agent=Casalo-Telefon

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:${SIP_PORT}

[fritzbox-registrierung]
type=registration
transport=transport-udp
outbound_auth=fritzbox-auth
server_uri=sip:${FRITZBOX_HOST}
client_uri=sip:${SIP_BENUTZER}@${FRITZBOX_HOST}
contact_user=${SIP_BENUTZER}
retry_interval=60
expiration=300

[fritzbox-auth]
type=auth
auth_type=userpass
username=${SIP_BENUTZER}
password=${SIP_PASSWORT}

[fritzbox]
type=endpoint
transport=transport-udp
context=casalo-eingang
disallow=all
allow=alaw,ulaw
outbound_auth=fritzbox-auth
aors=fritzbox
from_user=${SIP_BENUTZER}
from_domain=${FRITZBOX_HOST}
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733

[fritzbox]
type=aor
contact=sip:${FRITZBOX_HOST}

[fritzbox]
type=identify
endpoint=fritzbox
match=${FRITZBOX_HOST}
