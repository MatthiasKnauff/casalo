{% extends "base.html" %}
{% block titel %}Anmelden{% endblock %}
{% block inhalt %}
<div style="max-width:420px;margin:10vh auto">
  <h1>Casalo</h1>
  <p class="unter">{{ 'Ersteinrichtung – Sie werden Administrator.' if erststart else 'Bitte anmelden.' }}</p>
  <form method="post" class="karte">
    {% if erststart %}
    <label for="name">Ihr Name</label><input id="name" name="name" required>
    {% endif %}
    <label for="email">E-Mail</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="pw">Passwort</label><input id="pw" name="passwort" type="password" autocomplete="{{ 'new-password' if erststart else 'current-password' }}" required>
    {% if erststart %}
    <label for="pw2">Passwort wiederholen</label><input id="pw2" name="passwort2" type="password" autocomplete="new-password" required>
    <p class="hinweis">Mindestens 10 Zeichen.</p>
    {% endif %}
    <p style="margin:16px 0 0"><button>{{ 'Einrichten' if erststart else 'Anmelden' }}</button></p>
  </form>
</div>
{% endblock %}
